<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora todos los equipos y jugadores de las cinco grandes ligas europeas.">
  <title>El Vestuario | Fútbol Europeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#f3f4ed;--muted:#9aa09a;--bg:#0b0d0c;--panel:#121513;--line:#272c28;--green:#c8ff47;--orange:#ff6d3a;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;min-height:100vh}button,input{font:inherit}button{color:inherit}.shell{max-width:1440px;margin:auto;padding:0 32px}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;font-family:"Syne",sans-serif;font-size:19px;font-weight:800;letter-spacing:-.5px}.mark{width:34px;height:34px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#10120d;font-size:17px}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #c8ff4718}
    .hero{padding:32px 0}.counts{display:flex;gap:30px}.count strong{font-family:"Syne";font-size:28px}.count span{display:block;color:var(--muted);font-size:12px;margin-top:3px;text-transform:uppercase;letter-spacing:1px}
    .toolbar{position:sticky;top:0;z-index:10;background:#0b0d0cf2;backdrop-filter:blur(16px);padding:18px 0;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}.tools{display:flex;gap:12px;align-items:center}.league-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}.tab{border:1px solid var(--line);background:transparent;padding:11px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}.tab:hover{border-color:#5b635d}.tab.active{background:var(--green);color:#11150b;border-color:var(--green);font-weight:700}.search{position:relative;width:290px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:12px 18px 12px 42px;outline:none}.search input:focus{border-color:var(--green)}.search svg{position:absolute;left:16px;top:13px;color:var(--muted)}
    .content{padding:36px 0 80px;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:26px;align-items:start}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.section-head h2,.roster-title{font-family:"Syne";font-size:27px;margin:0;letter-spacing:-1px}.section-head span{color:var(--muted);font-size:13px}.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.team{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:86px;transition:.2s}.team:hover{transform:translateY(-2px);border-color:#59625b}.team.active{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.team img{width:42px;height:42px;object-fit:contain}.team b{display:block;font-size:14px}.team small{color:var(--muted)}
    .roster{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);position:sticky;top:95px;overflow:hidden}.roster-cover{padding:28px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}.roster-cover:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--club,#c8ff47);filter:blur(90px);opacity:.22;right:-40px;top:-70px}.club-head{display:flex;align-items:center;gap:16px;position:relative;z-index:1}.club-head img{width:70px;height:70px;object-fit:contain}.club-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.players{padding:12px;max-height:680px;overflow:auto}.player{width:100%;border:0;background:transparent;color:inherit;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:13px 12px;border-radius:14px;text-align:left;cursor:pointer}.player:hover{background:#1b1f1c}.avatar{width:42px;height:42px;border-radius:50%;background:#252a26;object-fit:cover}.player b{font-size:14px;display:block;margin-bottom:3px}.player small{color:var(--muted);font-size:12px}.player-side{text-align:right}.number{font-family:"Syne";color:#626a64;font-size:16px}.value{display:block;color:var(--green);font-size:11px;font-weight:700;margin-top:4px}.group-label{padding:18px 12px 7px;color:var(--green);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}.empty{padding:54px 24px;text-align:center;color:var(--muted)}.ball{font-size:34px;margin-bottom:12px}.loader{display:flex;justify-content:center;padding:70px}.loader:after{content:"";width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{border:1px solid #6f3828;background:#20130f;color:#ffb399;border-radius:16px;padding:18px;grid-column:1/-1}.footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
    .modal{border:0;padding:0;background:transparent;color:var(--ink);width:min(720px,calc(100% - 28px));max-height:90vh}.modal::backdrop{background:#050605d9;backdrop-filter:blur(8px)}.modal-card{background:#121513;border:1px solid #343a35;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px #0009}.modal-top{padding:28px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);position:relative}.modal-top .avatar{width:76px;height:76px}.modal-top h2{font-family:"Syne";font-size:30px;margin:0;letter-spacing:-1px}.modal-top p{margin:5px 0 0;color:var(--muted)}.close{position:absolute;right:18px;top:18px;width:36px;height:36px;border:1px solid var(--line);background:#1b1f1c;border-radius:50%;cursor:pointer;font-size:20px}.detail-value{margin-left:auto;margin-right:42px;text-align:right}.detail-value strong{font-family:"Syne";font-size:25px;color:var(--green);display:block}.detail-value span{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}.modal-body{padding:26px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}.stat{background:#1a1e1b;border:1px solid var(--line);border-radius:15px;padding:15px}.stat strong{font-family:"Syne";font-size:22px;display:block}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.detail-section h3{font-family:"Syne";font-size:17px;margin:0 0 12px}.titles{display:flex;flex-wrap:wrap;gap:8px}.title-chip{border:1px solid #3a423b;background:#1a1e1b;border-radius:12px;padding:10px 12px;font-size:12px}.title-chip strong{color:var(--green);margin-right:5px}.source-link{display:inline-block;margin-top:22px;color:var(--green);font-size:12px;text-decoration:none}.source-link:hover{text-decoration:underline}
    .initials{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#252d23;border:1px solid #3b4635;color:var(--green);font-family:"Syne";font-size:13px;font-weight:700;letter-spacing:.5px;flex:none}.modal-top .initials{width:76px;height:76px;font-size:19px}.flag{font-size:14px;margin-right:4px;vertical-align:-1px}.age{color:#c5cac6}
    @media(max-width:1180px){.hero{grid-template-columns:1fr}.hero h1{max-width:800px}.content{grid-template-columns:1fr 430px}.team-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:780px){.shell{padding:0 18px}.topbar{height:70px}.hero{padding:48px 0 35px}.hero h1{letter-spacing:-3px}.tools{flex-direction:column;align-items:stretch}.search{width:100%}.toolbar{padding:12px 0}.content{grid-template-columns:1fr}.roster{position:relative;top:auto;order:-1}.players{max-height:none}.team-grid{grid-template-columns:repeat(2,1fr)}.footer{gap:10px;flex-direction:column}}
    @media(max-width:480px){.team-grid{grid-template-columns:1fr}.counts{gap:20px}.hero h1{font-size:50px}.live span:last-child{display:none}.team{min-height:76px}.modal-top{align-items:flex-start;flex-wrap:wrap}.detail-value{margin:0}.detail-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="shell topbar"><div class="brand"><span class="mark">V</span>EL VESTUARIO</div><div class="live"><span class="dot"></span><span>Plantillas 2026–27</span></div></header>
  <main>
    <section class="shell hero"><div class="counts"><div class="count"><strong>5</strong><span>Ligas</span></div><div class="count"><strong id="teamCount">—</strong><span>Equipos</span></div><div class="count"><strong id="season">26/27</strong><span>Temporada</span></div></div></section>
    <div class="toolbar"><div class="shell tools"><div class="league-tabs" id="tabs"></div><label class="search" aria-label="Buscar equipo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Buscar equipo…"></label></div></div>
    <section class="shell content"><div><div class="section-head"><h2 id="leagueName">Equipos</h2><span id="resultCount"></span></div><div class="team-grid" id="teams"><div class="loader"></div></div></div><aside class="roster" id="roster"><div class="empty"><div class="ball">⚽</div>Selecciona un equipo<br>para ver su plantilla</div></aside></section>
  </main>
  <footer class="shell footer"><span>EL VESTUARIO © 2026</span><span>Valores y estadísticas de carrera: Transfermarkt</span></footer>
  <dialog class="modal" id="playerModal"><article class="modal-card"><div id="modalContent"></div></article></dialog>
  <script src="data.js"></script>
  <script>
    const leagues=[
      {id:'eng.1',name:'Premier League',flag:'🇬🇧'},
      {id:'esp.1',name:'LaLiga',flag:'🇪🇸'},
      {id:'ita.1',name:'Serie A',flag:'🇮🇹'},
      {id:'ger.1',name:'Bundesliga',flag:'🇩🇪'},
      {id:'fra.1',name:'Ligue 1',flag:'🇫🇷'}
    ];
    const state={league:'eng.1',teams:{},selected:null};
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const countryCodes={Albania:'AL',Algeria:'DZ',Angola:'AO',Argentina:'AR',Armenia:'AM',Australia:'AU',Austria:'AT',Belgium:'BE',Benin:'BJ',Bolivia:'BO','Bosnia and Herzegovina':'BA',Brazil:'BR',Bulgaria:'BG','Burkina Faso':'BF',Burundi:'BI',Cameroon:'CM',Canada:'CA','Cape Verde Islands':'CV','Central African Republic':'CF',Chile:'CL',Colombia:'CO',Congo:'CG','Congo DR':'CD',Croatia:'HR',Czechia:'CZ',Denmark:'DK','Dominican Republic':'DO',Ecuador:'EC',Egypt:'EG',England:'GB','Equatorial Guinea':'GQ',Estonia:'EE',Finland:'FI',France:'FR',Gabon:'GA',Gambia:'GM',Georgia:'GE',Germany:'DE',Ghana:'GH',Greece:'GR',Guadeloupe:'GP',Guinea:'GN','Guinea-Bissau':'GW',Haiti:'HT',Honduras:'HN',Hungary:'HU',Iceland:'IS',Indonesia:'ID',Iraq:'IQ',Israel:'IL',Italy:'IT','Ivory Coast':'CI',Jamaica:'JM',Japan:'JP',Jordan:'JO',Kazakhstan:'KZ',Kenya:'KE',Kosovo:'XK',Latvia:'LV',Libya:'LY',Lithuania:'LT',Malaysia:'MY',Mali:'ML',Martinique:'MQ',Mauritania:'MR',Mexico:'MX',Montenegro:'ME',Morocco:'MA',Mozambique:'MZ',Netherlands:'NL','New Zealand':'NZ',Niger:'NE',Nigeria:'NG','North Macedonia':'MK','Northern Ireland':'GB',Norway:'NO',Paraguay:'PY',Peru:'PE',Philippines:'PH',Poland:'PL',Portugal:'PT','Republic of Ireland':'IE',Romania:'RO',Russia:'RU','Saudi Arabia':'SA',Scotland:'GB',Senegal:'SN',Serbia:'RS','Sierra Leone':'SL',Slovakia:'SK',Slovenia:'SI','South Korea':'KR',Spain:'ES',Suriname:'SR',Sweden:'SE',Switzerland:'CH',Tanzania:'TZ',Thailand:'TH',Togo:'TG',Tunisia:'TN','Türkiye':'TR',USA:'US',Ukraine:'UA',Uruguay:'UY',Uzbekistan:'UZ',Venezuela:'VE',Wales:'GB',Zambia:'ZM'};
    const flag=country=>{const code=countryCodes[country];return code?[...code].map(c=>String.fromCodePoint(127397+c.charCodeAt())).join(''):'🌐'};
    const initials=name=>{const parts=String(name||'').trim().split(/\s+/);return ((parts[0]?.[0]||'')+(parts.length>1?parts.at(-1)[0]:(parts[0]?.[1]||''))).toUpperCase()};
    const logo=t=>t.logo||'';
    function renderTabs(){ $('#tabs').innerHTML=leagues.map(l=>`<button class="tab ${l.id===state.league?'active':''}" data-id="${l.id}">${l.flag} ${l.name}</button>`).join(''); }
    async function loadLeague(id){
      state.league=id;state.selected=null;renderTabs();$('#roster').innerHTML='<div class="empty"><div class="ball">⚽</div>Selecciona un equipo<br>para ver su plantilla</div>';$('#teams').innerHTML='<div class="loader"></div>';
      try{if(!state.teams[id])state.teams[id]=window.FOOTBALL_DATA[id].teams;renderTeams();updateTotal()}
      catch(e){$('#teams').innerHTML='<div class="error">No pudimos conectar con la fuente de datos. Comprueba tu conexión y vuelve a cargar la página.</div>'}
    }
    function renderTeams(){
      const q=$('#search').value.trim().toLowerCase(), all=state.teams[state.league]||[], items=all.filter(t=>t.displayName.toLowerCase().includes(q)), meta=leagues.find(l=>l.id===state.league);
      $('#leagueName').textContent=meta.name;$('#resultCount').textContent=`${items.length} equipos`;
      $('#teams').innerHTML=items.length?items.map(t=>`<button class="team ${state.selected===t.id?'active':''}" data-team="${t.id}"><img src="${esc(logo(t))}" alt="" loading="lazy"><span><b>${esc(t.displayName)}</b><small>${esc(t.abbreviation)}</small></span></button>`).join(''):'<div class="empty">No encontramos ese equipo.</div>';
    }
    async function updateTotal(){const loaded=Object.values(state.teams).reduce((n,a)=>n+a.length,0);$('#teamCount').textContent=Object.keys(state.teams).length===5?loaded:'98+'}
    async function showRoster(teamId){
      state.selected=teamId;renderTeams();const team=(state.teams[state.league]||[]).find(t=>t.id===teamId);$('#roster').innerHTML='<div class="loader"></div>';if(innerWidth<781)$('#roster').scrollIntoView({behavior:'smooth',block:'start'});
      try{const j=window.FOOTBALL_DATA[state.league].rosters[teamId];const players=j.players||[];const grouped={};players.forEach(p=>{(grouped[p.position]??=[]).push(p)});
        const playerHTML=Object.entries(grouped).map(([pos,list])=>`<div class="group-label">${esc(pos)} · ${list.length}</div>${list.map(p=>`<button class="player" data-player="${players.indexOf(p)}"><span class="initials" aria-hidden="true">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.exactPosition||p.position)} · <span class="flag">${flag(p.country)}</span>${esc(p.country)} <span class="age">· ${p.age||'—'} años</span></small></span><span class="player-side"><span class="number">${esc(p.number)}</span><span class="value">${esc(p.marketValue||'S/D')}</span></span></button>`).join('')}`).join('');
        $('#roster').style.setProperty('--club','#'+(team.color||'c8ff47'));$('#roster').innerHTML=`<div class="roster-cover"><div class="club-head"><img src="${esc(logo(team))}" alt=""><div><h2 class="roster-title">${esc(team.displayName)}</h2><p>${players.length} jugadores · ${esc(j.season)}</p></div></div></div><div class="players">${playerHTML||'<div class="empty">Plantilla no disponible.</div>'}</div>`;
      }catch(e){$('#roster').innerHTML='<div class="empty">No se pudo cargar esta plantilla.<br>Inténtalo de nuevo.</div>'}
    }
    const statNames={APPS:'Partidos',STRT:'Titularidades',G:'Goles',A:'Asistencias',MIN:'Minutos',YC:'T. amarillas',RC:'T. rojas'};
    function showPlayer(index){const roster=window.FOOTBALL_DATA[state.league].rosters[state.selected];const p=roster.players[index];if(!p)return;const stats=(p.stats?.items||[]).map(([key,val])=>`<div class="stat"><strong>${key==='MIN'?Number(val).toLocaleString('es-ES'):esc(val)}</strong><span>${esc(statNames[key]||key)}</span></div>`).join('');const titles=(p.titles||[]).map(t=>`<span class="title-chip"><strong>${t.count}×</strong>${esc(t.name)}</span>`).join('');$('#modalContent').innerHTML=`<div class="modal-top"><span class="initials" aria-hidden="true">${esc(initials(p.name))}</span><div><h2>${esc(p.name)}</h2><p>${esc(p.exactPosition||p.position)} · <span class="flag">${flag(p.country)}</span>${esc(p.country)} · ${p.age||'—'} años</p></div><div class="detail-value"><strong>${esc(p.marketValue||'S/D')}</strong><span>Valor Transfermarkt</span></div><button class="close" aria-label="Cerrar">×</button></div><div class="modal-body"><div class="detail-section"><h3>Estadísticas de toda la carrera</h3><div class="detail-grid">${stats||'<div class="empty">Sin estadísticas disponibles</div>'}</div></div><div class="detail-section"><h3>Títulos y reconocimientos</h3><div class="titles">${titles||'<span class="title-chip">Sin títulos registrados</span>'}</div></div>${p.tmUrl?`<a class="source-link" href="${esc(p.tmUrl)}" target="_blank" rel="noopener">Ver ficha en Transfermarkt ↗</a>`:''}</div>`;$('#playerModal').showModal()}
    $('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)loadLeague(b.dataset.id)});$('#teams').addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b)showRoster(b.dataset.team)});$('#search').addEventListener('input',renderTeams);$('#roster').addEventListener('click',e=>{const b=e.target.closest('[data-player]');if(b)showPlayer(Number(b.dataset.player))});$('#playerModal').addEventListener('click',e=>{if(e.target.id==='playerModal'||e.target.closest('.close'))$('#playerModal').close()});
    renderTabs();leagues.forEach(l=>state.teams[l.id]=window.FOOTBALL_DATA[l.id].teams);loadLeague(state.league);updateTotal();
  </script>
</body>
</html>
